services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: murder_mystery
      POSTGRES_PASSWORD: murder_mystery
      POSTGRES_DB: murder_mystery_voter_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murder_mystery -d murder_mystery_voter_dev"]
      interval: 2s
      retries: 20

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: murder_mystery
      POSTGRES_PASSWORD: murder_mystery
      POSTGRES_DB: murder_mystery_voter_test
    ports:
      - "5435:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murder_mystery -d murder_mystery_voter_test"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
  pgdata_test:
