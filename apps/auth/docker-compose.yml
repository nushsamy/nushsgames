services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nushsgames_auth
      POSTGRES_PASSWORD: nushsgames_auth
      POSTGRES_DB: auth_dev
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nushsgames_auth -d auth_dev"]
      interval: 2s
      retries: 20

  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: nushsgames_auth
      POSTGRES_PASSWORD: nushsgames_auth
      POSTGRES_DB: auth_test
    ports:
      - "5437:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nushsgames_auth -d auth_test"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
  pgdata_test:
